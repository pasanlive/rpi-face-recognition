<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Live Camera Feed — Monitor 1 Display</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body, html {
      width: 100%;
      height: 100%;
      background-color: #000;
      overflow: hidden;
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
    }
    .stream-container {
      width: 100vw;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
      background: #000;
    }
    .stream-container img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
    }
    .overlay-badge {
      position: absolute;
      top: 20px;
      right: 24px;
      background: rgba(11, 15, 25, 0.75);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      color: #f8fafc;
      padding: 0.5rem 1.25rem;
      border-radius: 20px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      font-size: 0.85rem;
      font-weight: 500;
      display: flex;
      align-items: center;
      gap: 0.6rem;
      box-shadow: 0 4px 15px rgba(0,0,0,0.5);
      pointer-events: none;
    }
    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background-color: #10b981;
      box-shadow: 0 0 8px #10b981;
    }
  </style>
</head>
<body>
  <div class="stream-container">
    <div class="overlay-badge">
      <span class="status-dot"></span>
      Monitor 1 — Live AI Camera Stream
    </div>
    <img id="live-stream-img" src="/video_feed" alt="Live Camera Stream">
  </div>
  <script>
    // Double click to toggle native full screen
    document.addEventListener('dblclick', () => {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(() => {});
      } else {
        document.exitFullscreen().catch(() => {});
      }
    });
  </script>
</body>
</html>
